name: FTP Deploy

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy Website
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: |
        mvn clean package -DskipTests
        JAR_NAME=$(mvn help:evaluate -Dexpression=project.build.finalName -q -DforceStdout).jar
        echo "JAR_NAME=$JAR_NAME" >> $GITHUB_ENV

    - name: Prepare FTP Upload Folder
      run: |
        mkdir -p dist
        cp target/*.jar dist/

    - name: 📂 Sync files to SFTP
      uses: wlixcc/SFTP-Deploy-Action@v1.2.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: ${{ secrets.FTP_PORT }}
        local_path: './dist/*'
        remote_path: '/home/gsoy'
        sftp_only: true

    - name: 🚀 Run Deploy Script via SSH
      uses: appleboy/ssh-action@v1.0.3
      env:
        JAR_NAME: ${{ env.JAR_NAME }}
      with:
        host: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: ${{ secrets.FTP_PORT }}
        envs: JAR_NAME
        script: |
          echo "Stopping existing process for $JAR_NAME..."
          pkill -f "$JAR_NAME" || true
          sleep 3
          echo "Starting $JAR_NAME with nohup..."
          nohup java -jar /home/gsoy/$JAR_NAME > /home/gsoy/app.log 2>&1 &

